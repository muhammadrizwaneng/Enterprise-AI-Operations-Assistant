<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}DB Browser{% endblock %} · Enterprise AI</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --panel: #ffffff;
      --ink: #15202b;
      --muted: #5b6b7c;
      --line: #d9e1ea;
      --accent: #0f6e56;
      --accent-soft: #e7f5f0;
      --danger: #b42318;
      --danger-soft: #fef3f2;
      --null: #9aa8b5;
      --shadow: 0 10px 30px rgba(21, 32, 43, 0.06);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, #e8f3ef 0, transparent 40%),
        linear-gradient(180deg, #eef2f6, var(--bg));
      min-height: 100vh;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .shell { max-width: 1200px; margin: 0 auto; padding: 28px 20px 48px; }
    header {
      display: flex; justify-content: space-between; align-items: end;
      gap: 16px; margin-bottom: 24px;
    }
    .brand { font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
    h1 { margin: 6px 0 0; font-size: 28px; line-height: 1.15; }
    .nav { display: flex; gap: 12px; flex-wrap: wrap; }
    .nav a {
      background: var(--panel); border: 1px solid var(--line);
      padding: 8px 12px; border-radius: 10px; color: var(--ink); box-shadow: var(--shadow);
    }
    .card {
      background: var(--panel); border: 1px solid var(--line);
      border-radius: 16px; box-shadow: var(--shadow); overflow: hidden;
    }
    .table-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
    .table-card {
      display: block; background: var(--panel); border: 1px solid var(--line);
      border-radius: 14px; padding: 16px; box-shadow: var(--shadow); color: inherit;
    }
    .table-card:hover { border-color: #9ec9ba; background: var(--accent-soft); text-decoration: none; }
    .table-card strong { display: block; font-size: 16px; margin-bottom: 6px; }
    .meta { color: var(--muted); font-size: 13px; }
    .toolbar {
      display: flex; justify-content: space-between; align-items: center;
      gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap;
    }
    .pager { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .btn {
      display: inline-block; padding: 8px 12px; border-radius: 10px;
      border: 1px solid var(--line); background: #fff; color: var(--ink);
      cursor: pointer; font: inherit; text-decoration: none;
    }
    .btn:hover { text-decoration: none; }
    .btn[disabled] { opacity: 0.4; pointer-events: none; }
    .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .btn.danger { background: var(--danger); color: #fff; border-color: var(--danger); }
    .btn.ghost-danger {
      background: var(--danger-soft); color: var(--danger); border-color: #f3c4bf;
    }
    .scroll { overflow: auto; max-height: calc(100vh - 280px); }
    table { border-collapse: collapse; width: 100%; font-size: 13px; }
    th, td {
      border-bottom: 1px solid var(--line); padding: 10px 12px;
      text-align: left; vertical-align: top; white-space: nowrap;
    }
    th {
      position: sticky; top: 0; background: #f8fafc; z-index: 1;
      font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted);
    }
    tr:hover td { background: #f7fbf9; }
    .null { color: var(--null); font-style: italic; }
    .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12px; }
    .actions { display: flex; gap: 8px; align-items: center; }
    .search-bar {
      display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
      padding: 14px 16px; border-bottom: 1px solid var(--line); background: #fbfcfd;
    }
    .search-bar input[type="search"],
    .form-grid input,
    .form-grid textarea,
    .form-grid select {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      font: inherit;
      min-width: 220px;
      background: #fff;
      color: var(--ink);
    }
    .search-bar input[type="search"] { flex: 1; min-width: 240px; }
    .flash {
      margin: 0 0 16px;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--line);
    }
    .flash.ok { background: var(--accent-soft); border-color: #b7e0d2; color: #0b5a45; }
    .flash.error { background: var(--danger-soft); border-color: #f3c4bf; color: var(--danger); }
    .form-card { padding: 20px; }
    .form-grid { display: grid; gap: 14px; }
    .form-grid label { display: grid; gap: 6px; font-size: 13px; color: var(--muted); }
    .form-grid label strong { color: var(--ink); font-size: 14px; }
    .form-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
    .readonly {
      background: #f3f5f7 !important;
      color: var(--muted);
    }
    .hint { font-size: 12px; color: var(--muted); }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div>
        <div class="brand">Enterprise AI Operations Assistant</div>
        <h1>{% block heading %}Database Browser{% endblock %}</h1>
      </div>
      <nav class="nav">
        <a href="/db">All tables</a>
        <a href="/api/v1/database/stats">API stats</a>
        <a href="/docs">API docs</a>
        <a href="/health">Health</a>
      </nav>
    </header>
    {% block content %}{% endblock %}
  </div>
</body>
</html>
